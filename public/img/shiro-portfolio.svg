<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="SH1R00 Portfolio preview card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132d"/>
      <stop offset="0.55" stop-color="#30205d"/>
      <stop offset="1" stop-color="#1a1637"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.74" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#b77dff" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#b77dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="1" r="0.7">
      <stop offset="0" stop-color="#5437c1" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5437c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b77dff"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow1)"/>
  <rect width="1280" height="800" fill="url(#glow2)"/>

  <!-- subtle orbit motif -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1">
    <ellipse cx="640" cy="400" rx="300" ry="150" transform="rotate(-22 640 400)"/>
    <ellipse cx="640" cy="400" rx="300" ry="150" transform="rotate(22 640 400)"/>
  </g>

  <!-- monogram tile -->
  <g transform="translate(640 330)">
    <rect x="-58" y="-58" width="116" height="116" rx="26" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.38"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff" fill-opacity="0.92">S</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="-2" fill="url(#wordmark)">shiro</text>

  <!-- kicker -->
  <text x="640" y="574" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" letter-spacing="6" fill="#ffffff" fill-opacity="0.72">SH1R00 PORTFOLIO</text>

  <!-- host -->
  <text x="640" y="618" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="1" fill="#ffffff" fill-opacity="0.60">shiro-portfolio-nuxt4.rasisg.workers.dev</text>

  <!-- tagline -->
  <text x="640" y="668" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#ffffff" fill-opacity="0.82">where style meets function</text>
</svg>
