# Netlify — Nuxt 4 SSR (Nitro `netlify` preset).
# Was SSG (`npm run generate`); now SSR so the libSQL-backed works data + admin
# can be updated at runtime. Functions auto-detected from `.netlify/`.
# `--legacy-peer-deps`: esbuild peer conflict (vite@8 vs @intlify/bundle-utils).
# NODE_VERSION=24: nuxt-security@2.6.0 requires node >=24 (EBADENGINE on 22).
[build]
  command = "npm install --legacy-peer-deps --no-audit --no-fund && npx nuxi build --preset netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
